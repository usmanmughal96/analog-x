name: Refresh NASA Earthdata catalogue evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_nasa_cmr_catalog.py"
      - ".github/workflows/fetch-nasa-cmr.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Search NASA Earthdata CMR
        run: python scripts/fetch_nasa_cmr_catalog.py
      - name: Commit CMR catalogue evidence
        run: bash scripts/commit_generated_data.sh "Add NASA Earthdata CMR collection and granule catalog" data/nasa/earthdata_cmr_catalog.json
