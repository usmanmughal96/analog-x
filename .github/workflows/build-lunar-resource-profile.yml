name: Build lunar Diviner resource profile

on:
  push:
    branches: [main]
    paths:
      - "scripts/process_diviner_prp.py"
      - "data/moon/shackleton_lola_80m.json"
      - ".github/workflows/build-lunar-resource-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install processing dependency
        run: python -m pip install --upgrade requests
      - name: Process Diviner south-polar PRP over Shackleton Rim
        run: python scripts/process_diviner_prp.py
      - name: Commit derived lunar resource profile
        run: bash scripts/commit_generated_data.sh "Add Shackleton Rim Diviner polar resource profile" data/moon/shackleton_diviner_prp.json