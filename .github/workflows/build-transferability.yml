name: Build planetary analog transferability science pack
on:
  push:
    branches: [main]
    paths:
      - "science/**"
      - "data/agents/candidate_catalog.json"
      - "data/power/**"
      - "data/terrain/**"
      - "data/moon/**"
      - "scripts/fetch_pds_search.py"
      - "scripts/fetch_planetary_archive_discovery.py"
      - "tests/test_planetary_archive_discovery.py"
      - "scripts/fetch_modis_browse.py"
      - "tests/test_pds_search_api.py"
      - "backend/**"
      - "transferability.html"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: write
concurrency:
  group: analogx-repository-data-publish
  queue: max
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data and backend test dependencies
        run: python -m pip install --upgrade requests httpx pyshp pyproj shapely -r backend/requirements.txt
      - name: Build experiment-level transferability dossiers
        run: python science/build_transferability.py
      - name: Discover planetary products in NASA PDS
        run: python scripts/fetch_pds_search.py
      - name: Test PDS Search API response parsing
        run: python -m unittest tests.test_pds_search_api
      - name: Discover spatially bounded ODE and USGS planetary archive metadata
        run: python scripts/fetch_planetary_archive_discovery.py
      - name: Test ODE and USGS archive response adapters
        run: python -m unittest tests.test_planetary_archive_discovery
      - name: Build Shackleton PSR polygon intersection evidence from NASA PGDA LOLA
        run: python scripts/process_lunar_psr_vectors.py
      - name: Test lunar PSR projection and intersection analysis
        run: python -m unittest tests.test_lunar_psr_intersection
      - name: Discover MODIS land-surface-temperature browse tiles
        run: python scripts/fetch_modis_browse.py
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.current = []
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.capture = not any(key.lower() == "src" for key, _ in attrs)
                      self.current = []

              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.blocks.append("\\n".join(self.current))
                      self.capture = False

              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)

          parser = InlineScripts()
          parser.feed(Path("transferability.html").read_text(encoding="utf-8"))
          if not parser.blocks:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/atfa-dashboard.js").write_text("\\n".join(parser.blocks), encoding="utf-8")
          PY
          node --check /tmp/atfa-dashboard.js
      - name: Validate backend Python syntax
        run: python -m py_compile backend/app.py backend/smoke_test.py science/build_transferability.py scripts/fetch_pds_search.py scripts/fetch_planetary_archive_discovery.py scripts/fetch_modis_browse.py scripts/build_terrain_comparison.py scripts/build_lunar_south_pole_lola_80m.py
      - name: Smoke-test FastAPI science and field-record endpoints
        run: python backend/smoke_test.py
      - name: Validate JSON science pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path("data/transferability/transferability.json"), Path("data/planetary/pds_search.json"), Path("data/planetary/archive_discovery.json"), Path("data/moon/lola_psr_site_overlap.json"), Path("data/nasa/modis_browse_index.json")]:
              d=json.loads(p.read_text())
              print(p, "valid", len(p.read_bytes()), "bytes")
          d=json.loads(Path("data/transferability/transferability.json").read_text())
          assert d["site_count"] >= 10
          assert sum(len(s["tests"]) for s in d["sites"]) >= 20
          assert d["planetary_targets"]["moon"]["terrain"]
          assert d["planetary_targets"]["mars"]["terrain"]
          PY
      - name: Commit refreshed public science pack
        run: bash scripts/commit_generated_data.sh "Build planetary analog transferability science pack" data/transferability/transferability.json data/planetary/pds_search.json data/planetary/archive_discovery.json data/moon/lola_psr_site_overlap.json data/source_registry.json data/nasa/modis_browse_index.json data/nasa/modis_browse/