name: Build planetary analog transferability science pack
on:
  push:
    branches: [main]
    paths:
      - "science/**"
      - "data/agents/candidate_catalog.json"
      - "data/power/**"
      - "data/terrain/**"
      - "data/moon/**"
      - ".github/workflows/build-transferability.yml"
      - "scripts/fetch_pds_search.py"
      - "scripts/fetch_modis_browse.py"
      - "backend/**"
      - "transferability.html"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: write
concurrency:
  group: analogx-science-pack
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data and backend test dependencies
        run: python -m pip install --upgrade requests httpx -r backend/requirements.txt
      - name: Build experiment-level transferability dossiers
        run: python science/build_transferability.py
      - name: Discover planetary products in NASA PDS
        run: python scripts/fetch_pds_search.py
      - name: Discover MODIS land-surface-temperature browse tiles
        run: python scripts/fetch_modis_browse.py
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('transferability.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S)
          inline=[s for s in scripts if s.strip()]
          assert inline, 'No inline dashboard script found'
          Path('/tmp/atfa-dashboard.js').write_text('\\n'.join(inline), encoding='utf-8')
          PY
          node --check /tmp/atfa-dashboard.js
      - name: Validate backend Python syntax
        run: python -m py_compile backend/app.py backend/smoke_test.py science/build_transferability.py scripts/fetch_pds_search.py scripts/fetch_modis_browse.py scripts/build_terrain_comparison.py scripts/build_lunar_south_pole_lola_80m.py
      - name: Smoke-test FastAPI science and field-record endpoints
        run: python backend/smoke_test.py
      - name: Validate JSON science pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path("data/transferability/transferability.json"), Path("data/planetary/pds_search.json"), Path("data/nasa/modis_browse_index.json")]:
              d=json.loads(p.read_text())
              print(p, "valid", len(p.read_bytes()), "bytes")
          d=json.loads(Path("data/transferability/transferability.json").read_text())
          assert d["site_count"] >= 10
          assert sum(len(s["tests"]) for s in d["sites"]) >= 20
          assert d["planetary_targets"]["moon"]["terrain"]
          assert d["planetary_targets"]["mars"]["terrain"]
          PY
      - name: Commit refreshed public science pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transferability/transferability.json data/planetary/pds_search.json data/nasa/modis_browse_index.json data/nasa/modis_browse/
          if ! git diff --cached --quiet; then
            git commit -m "Build planetary analog transferability science pack"
            for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Push retry limit reached."
          exit 1
          fi
