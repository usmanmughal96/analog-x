name: Build matched-scale Earth-Mars terrain evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_terrain_comparison.py"
      - "science/build_regional_window_scan.py"
      - "data/agents/candidate_catalog.json"
      - "data/transferability/transferability.json"
      - "data/moon/**"
      - "scripts/fetch_public_evidence.py"
      - ".github/workflows/build-terrain-comparison.yml"
      - "data/pakistan/public_scene_catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh
  cancel-in-progress: false

jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache public MOLA 64 px/degree source tiles
        uses: actions/cache@v4
        with:
          path: data/raw/mars/mola64
          key: analogx-mola-megdr-64ppd-nili-patera-v1

      - name: Install geospatial dependencies
        run: python -m pip install --upgrade requests rasterio pillow numpy scipy

      - name: Build matched-scale terrain descriptors
        run: python scripts/build_terrain_comparison.py

      - name: Build regional candidate-window scan
        run: python science/build_regional_window_scan.py

      - name: Run regional-window unit tests
        run: |
          python -m py_compile science/build_regional_window_scan.py
          python -m unittest discover -s tests -p "test_regional_window_scan.py"

      - name: Validate discovery page JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture=False
                  self.blocks=[]
                  self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.capture=True
                      self.current=[]
              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.blocks.append("\n".join(self.current))
                      self.capture=False
              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)
          parser=Scripts()
          parser.feed(Path("discovery.html").read_text())
          Path("/tmp/discovery-inline.js").write_text("\n".join(parser.blocks))
          assert parser.blocks, "No inline discovery script found"
          PY
          node --check /tmp/discovery-inline.js

      - name: Validate terrain and candidate-window outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          terrain=json.loads(Path("data/terrain/terrain_comparison.json").read_text())
          scan=json.loads(Path("data/analog_benchmark/regional_window_scan.json").read_text())
          assert len(terrain["earth_sites"]) == 10
          fine=sum(1 for site in terrain["earth_sites"].values() if site.get("native_30m_diagnostics",{}).get("status")=="processed")
          scan_windows=[w for target in scan["targets"].values() for w in target["candidate_windows"]]
          assert all("parent_earth_30m_context" in w for w in scan_windows)
          print("Earth parent areas with valid 30m diagnostics:", fine, "/ 10")
          assert scan["inputs"]["earth_region_count"] == 10
          assert scan["inputs"]["earth_window_count"] >= 7000
          assert scan["targets"]["moon"]["candidate_windows"]
          assert scan["targets"]["mars"]["candidate_windows"]
          for target in scan["targets"].values():
              assert all(w.get("atfa_context", {}).get("priority_experiment") for w in target["candidate_windows"])
              assert all(w.get("atfa_context", {}).get("experiment_tracks") for w in target["candidate_windows"])
          print("Regional scan validated:", scan["inputs"]["earth_window_count"], "Earth windows; ATFA dossiers and separate 30m Earth context attached.")
          PY

      - name: Commit derived terrain evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/ data/analog_benchmark/
          if git diff --cached --quiet; then
            echo "Terrain outputs unchanged."
            exit 0
          fi
          git commit -m "Add matched-scale Earth-Mars terrain evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Push retry limit reached."
          exit 1
