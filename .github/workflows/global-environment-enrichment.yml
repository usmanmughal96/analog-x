name: Enrich global candidates with 2023 land-cover evidence

on:
  workflow_run:
    workflows: ["Build global Copernicus GLO-90 discovery and validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-science-data-publish
  cancel-in-progress: false
jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest science release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: python -m pip install --upgrade requests numpy rasterio scipy

      - name: Check prerequisites and syntax
        run: |
          test -f data/global_discovery/global_discovery.json
          python -m py_compile scripts/enrich_global_landcover.py scripts/enrich_global_power.py scripts/enrich_global_lithology.py scripts/refresh_source_registry.py scripts/build_quantitative_validation.py
          python -m unittest tests.test_global_landcover tests.test_global_power tests.test_global_lithology
          python scripts/validate_field_observations.py

      - name: Enrich global terrain shortlist with annual land-cover classes
        run: python scripts/enrich_global_landcover.py

      - name: Enrich retained global candidates with NASA POWER climatology
        run: python scripts/enrich_global_power.py

      - name: Enrich retained shortlist with global generalized lithology context
        run: python scripts/enrich_global_lithology.py

      - name: Refresh source register and validation summary
        run: |
          python scripts/refresh_source_registry.py
          python scripts/build_quantitative_validation.py
          python scripts/validate_evidence_inventory.py
          python scripts/validate_field_observations.py

      - name: Build SHA-256 provenance manifest
        run: python scripts/build_reproducibility_manifest.py

      - name: Commit land-cover enrichment and provenance
        run: >-
          bash scripts/commit_generated_data.sh
          "Enrich global analog candidates with 2023 land cover"
          data/global_discovery/global_discovery.json
          data/global_discovery/global_landcover_enrichment.json
          data/global_discovery/global_power_enrichment.json
          data/global_discovery/global_lithology_enrichment.json
          data/source_registry.json
          data/validation/quantitative_validation.json
          data/provenance/reproducibility_manifest.json
