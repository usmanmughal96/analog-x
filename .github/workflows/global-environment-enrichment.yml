name: Enrich global candidates with 2023 land-cover evidence

on:
  workflow_run:
    workflows: ["Build global Copernicus GLO-90 discovery and validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-global-environment-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest science release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: python -m pip install --upgrade requests numpy rasterio scipy

      - name: Check prerequisites and syntax
        run: |
          test -f data/global_discovery/global_discovery.json
          python -m py_compile scripts/enrich_global_landcover.py scripts/refresh_source_registry.py scripts/build_quantitative_validation.py
          python -m unittest tests.test_global_landcover
          python scripts/validate_field_observations.py

      - name: Enrich global terrain shortlist with annual land-cover classes
        run: python scripts/enrich_global_landcover.py

      - name: Refresh source register and validation summary
        run: |
          python scripts/refresh_source_registry.py
          python scripts/build_quantitative_validation.py
          python scripts/validate_evidence_inventory.py
          python scripts/validate_field_observations.py

      - name: Build SHA-256 provenance manifest
        run: python scripts/build_reproducibility_manifest.py

      - name: Commit land-cover enrichment and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global_discovery/global_discovery.json data/global_discovery/global_landcover_enrichment.json data/source_registry.json data/validation/quantitative_validation.json data/provenance/reproducibility_manifest.json
          if git diff --cached --quiet; then
            echo "No enrichment changes to publish."
            exit 0
          fi
          git commit -m "Enrich global analog candidates with 2023 land cover"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not publish land-cover enrichment after five attempts."
          exit 1
