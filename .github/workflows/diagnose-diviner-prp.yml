name: Build Shackleton lunar thermal and illumination profile

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_diviner_prp_access.py"
      - "scripts/process_lunar_base_evidence.py"
      - "tests/test_lunar_base_evidence.py"
      - ".github/workflows/diagnose-diviner-prp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific processing dependencies
        run: python -m pip install --upgrade requests numpy rasterio pillow pyproj
      - name: Test integer-safe masked raster conversion
        run: python -m unittest tests.test_lunar_base_evidence
      - name: Diagnose Diviner source metadata and data access
        run: python scripts/diagnose_diviner_prp_access.py
      - name: Process Diviner thermal / ice stability and LROC illumination data
        run: python scripts/process_lunar_base_evidence.py
      - name: Commit reproducible lunar science products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moon/diviner_prp_diagnostic/report.json
          git add data/moon/shackleton_polar_evidence.json
          git add data/moon/shackleton_wac_illumination_twi.png
          git commit -m "Add Shackleton Diviner thermal and LROC illumination evidence"
          git pull --rebase origin main
          git push
