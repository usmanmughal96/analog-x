name: Refresh global and Pakistan Earth-observation evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_public_evidence.py"
      - "scripts/build_scene_quicklooks.py"
      - "scripts/fetch_nasa_epic.py"
      - ".github/workflows/fetch-public-evidence.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: python -m pip install --upgrade requests rasterio pillow numpy

      - name: Fetch optional NASA EPIC global Earth image
        run: python scripts/fetch_nasa_epic.py

      - name: Discover public Sentinel-2 scenes and Pakistan glacier metadata
        run: python scripts/fetch_public_evidence.py

      - name: Build Sentinel-2 site quicklooks
        run: python scripts/build_scene_quicklooks.py

      - name: Commit NASA and Pakistan EO assets
        run: bash scripts/commit_generated_data.sh "Refresh NASA EPIC and Pakistan EO evidence assets" data/pakistan/ data/nasa/