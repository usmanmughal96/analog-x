name: Refresh global and Pakistan Earth-observation evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_public_evidence.py"
      - "scripts/build_scene_quicklooks.py"
      - "scripts/fetch_nasa_epic.py"
      - ".github/workflows/fetch-public-evidence.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: python -m pip install --upgrade requests rasterio pillow numpy

      - name: Fetch optional NASA EPIC global Earth image
        run: python scripts/fetch_nasa_epic.py

      - name: Discover public Sentinel-2 scenes and Pakistan glacier metadata
        run: python scripts/fetch_public_evidence.py

      - name: Build Sentinel-2 site quicklooks
        run: python scripts/build_scene_quicklooks.py

      - name: Commit NASA and Pakistan EO assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pakistan/ data/nasa/
          if git diff --cached --quiet; then
            echo "Evidence assets unchanged."
            exit 0
          fi
          git commit -m "Refresh NASA EPIC and Pakistan EO evidence assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Push retry limit reached."
          exit 1
