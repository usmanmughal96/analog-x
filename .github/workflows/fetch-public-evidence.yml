name: Refresh Pakistan public Earth-observation evidence
on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_public_evidence.py"
      - ".github/workflows/fetch-public-evidence.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: write
concurrency:
  group: pakistan-public-evidence
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Discover public scenes and glacier metadata
        run: python scripts/fetch_public_evidence.py
      - name: Commit evidence catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pakistan/
          if git diff --cached --quiet; then
            echo "Evidence catalogue unchanged."
            exit 0
          fi
          git commit -m "Refresh Pakistan public EO evidence catalogue"
          git push
