name: Verify and release completed global ranking
on:
  push:
    branches: [main]
    paths:
      - "scripts/verify_global_ranking_release.py"
      - ".github/workflows/global-ranking-release.yml"
      - "scripts/build_independent_review_pack.py"
      - "scripts/import_independent_review_labels.py"
      - "scripts/build_reproducibility_manifest.py"
      - "scripts/build_quantitative_validation.py"
      - "tests/test_research_phase_pack.py"
      - "tests/test_reproducibility_manifest.py"
  pull_request:
    paths:
      - "scripts/build_independent_review_pack.py"
      - "scripts/import_independent_review_labels.py"
      - "scripts/build_lunar_south_pole_reference.py"
      - "scripts/build_reproducibility_manifest.py"
      - "scripts/build_quantitative_validation.py"
      - "tests/test_research_phase_pack.py"
      - "tests/test_lunar_reference_source.py"
      - "tests/test_reproducibility_manifest.py"
      - ".github/workflows/global-ranking-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('analogx-pr-{0}-{1}', github.workflow, github.event.pull_request.number) || 'analogx-repository-data-publish' }}
  queue: max
  cancel-in-progress: false
jobs:
  scientific-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific test dependencies
        run: python -m pip install --upgrade numpy requests rasterio pillow
      - name: Compile and run independent-validation and lunar-QA tests
        run: |
          python -m py_compile scripts/build_independent_review_pack.py scripts/import_independent_review_labels.py scripts/build_lunar_south_pole_reference.py scripts/build_reproducibility_manifest.py scripts/build_quantitative_validation.py
          python -m unittest tests.test_research_phase_pack
          python -m unittest tests.test_lunar_reference_source
          python -m unittest tests.test_analog_label_validation
          python -m unittest tests.test_validation_release
          python -m unittest tests.test_reproducibility_manifest

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade numpy
      - name: Verify existing 24-shard scan and core-only shortlist
        run: |
          python scripts/verify_global_ranking_release.py
          python scripts/build_independent_review_pack.py --skip-review-packet
          python scripts/validate_analog_labels.py
      - name: Validate evidence ledgers
        run: |
          python scripts/validate_field_observations.py
          python scripts/validate_evidence_inventory.py
          python -m unittest tests.test_validation_release
          python -m unittest tests.test_analog_label_validation
          python -m unittest tests.test_research_phase_pack
      - name: Generate manifest, then quantitative report
        run: |
          python scripts/build_reproducibility_manifest.py
          python scripts/build_quantitative_validation.py --require-ranking-ready
      - name: Publish ranking contract and validation status
        run: bash scripts/commit_generated_data.sh "Release verified global core-only ranking contract" data/global_discovery/global_discovery.json data/global_discovery/top_ranked_candidates.json data/validation/ data/provenance/reproducibility_manifest.json
