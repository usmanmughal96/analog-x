name: Build lunar south-pole LOLA reference

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_lunar_south_pole_reference.py"
      - "tests/test_lunar_reference_source.py"
      - ".github/workflows/build-lunar-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lunar-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial dependencies
        run: python -m pip install --upgrade requests rasterio pillow numpy scipy

      - name: Test LOLA source download validation
        run: python -m unittest tests.test_lunar_reference_source

      - name: Process NASA LOLA 5 m Shackleton Rim products
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "LOLA remote COG processing attempt $attempt/3"
            if python scripts/build_lunar_south_pole_reference.py; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 20))
              echo "Remote COG read or processing failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "LOLA 5 m processing failed after three attempts."
          exit 1

      - name: Commit lunar south-pole evidence
        run: bash scripts/commit_generated_data.sh "Add LOLA 5 m Shackleton Rim terrain reference" data/moon/