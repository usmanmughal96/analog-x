name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate app, agent and scientific data contracts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser and Worker JavaScript syntax
        run: |
          node --check assets/analogx-labs.js
          node --input-type=module --check < agent-worker/index.js
      - name: Validate data, UI and agent contracts
        run: node scripts/validate_project.mjs

      - name: Set up Python for field and source registry validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate GitHub Actions workflow YAML syntax
        run: |
          python -m pip install --upgrade pyyaml requests pyshp pyproj shapely
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_files = sorted(
              list(Path(".github/workflows").glob("*.yml"))
              + list(Path(".github/workflows").glob("*.yaml"))
          )
          if not workflow_files:
              raise SystemExit("No workflow YAML files were found")
          for path in workflow_files:
              yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              print(f"Valid YAML: {path}")
          PY

      - name: Validate field evidence, source registry and inline browser scripts
        run: |
          python scripts/validate_field_observations.py
          python -m unittest tests.test_field_observation_timestamps
          python -m unittest tests.test_pds_search_api
          python -m unittest tests.test_planetary_archive_discovery
          python -m unittest tests.test_lunar_psr_intersection
          python scripts/validate_evidence_inventory.py
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=False
                  self.blocks=[]
                  self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.active=True
                      self.current=[]
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      self.blocks.append("\\n".join(self.current))
                      self.active=False
              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)
          for filename in ("global-discovery.html", "discovery.html", "field-validation.html", "mission-readiness.html", "independent-review.html"):
              parser=InlineScripts()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              assert parser.blocks, f"No inline JS found in {filename}"
              Path(f"/tmp/{filename}.js").write_text("\\n".join(parser.blocks),encoding="utf-8")
          PY
          node --check /tmp/global-discovery.html.js
          node --check /tmp/discovery.html.js
          node --check /tmp/field-validation.html.js
          node --check /tmp/mission-readiness.html.js
          node --check /tmp/independent-review.html.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
