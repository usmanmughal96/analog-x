name: Diagnose alternate PDS LOLA south-pole access

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_lola_mit_access.py"
      - ".github/workflows/diagnose-lola-mit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-publish
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Probe NASA LOLA PDS mirror
        run: python scripts/diagnose_lola_mit_access.py
      - name: Commit diagnostics
        run: bash scripts/commit_generated_data.sh "Add MIT LOLA PDS mirror access diagnostic" data/moon/mit_lola_diagnostic/
