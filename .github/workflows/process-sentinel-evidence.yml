name: Process Pakistan Sentinel-2 analog evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/process_sentinel_evidence.py"
      - "data/pakistan/public_scene_catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-publish
  queue: max
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install raster processing dependencies
        run: python -m pip install --upgrade requests numpy rasterio pillow

      - name: Process Sentinel-2 L2A scenes
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
        run: python scripts/process_sentinel_evidence.py

      - name: Commit derived imagery and profiles
        run: bash scripts/commit_generated_data.sh "Add processed Sentinel-2 Pakistan analog evidence" data/pakistan/imagery/