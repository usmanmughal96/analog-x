name: Build source provenance and quantitative readiness report

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_reproducibility_manifest.py"
      - "scripts/build_quantitative_validation.py"
      - "scripts/enrich_global_power.py"
      - "scripts/enrich_global_landcover.py"
      - "scripts/refresh_source_registry.py"
      - "scripts/validate_field_observations.py"
      - "scripts/validate_evidence_inventory.py"
      - "tests/**"
      - "README.md"
      - "index.html"
      - "global-discovery.html"
      - "field-validation.html"
      - "scripts/build_quantitative_validation.py"
      - "scripts/validate_evidence_inventory.py"
      - "data/source_registry.json"
      - "data/validation/nasadem_crosscheck.json"
      - "data/global_discovery/global_discovery.json"
      - "data/global_discovery/global_landcover_enrichment.json"
      - "data/global_discovery/global_power_enrichment.json"
      - "science/**"
      - "scripts/sites.json"
      - "docs/METHODOLOGY.md"
      - "docs/LIMITATIONS.md"
      - "!data/provenance/reproducibility_manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-publish
  queue: max
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install science pipeline dependencies
        run: python -m pip install --upgrade requests numpy rasterio scipy

      - name: Compile science scripts and run deterministic unit tests
        run: |
          python -m py_compile scripts/*.py science/*.py
          python -m unittest tests.test_global_discovery tests.test_global_landcover tests.test_global_power

      - name: Validate the empty-or-populated field ledger
        run: python scripts/validate_field_observations.py

      - name: Validate source evidence states and product artifacts
        run: python scripts/validate_evidence_inventory.py

      - name: Generate SHA-256 source and code manifest
        run: python scripts/build_reproducibility_manifest.py

      - name: Build quantitative validation readiness report against this manifest
        run: python scripts/build_quantitative_validation.py

      - name: Commit manifest and report
        run: bash scripts/commit_generated_data.sh "Publish reproducibility manifest and validation readiness report" data/provenance/reproducibility_manifest.json data/validation/quantitative_validation.json
