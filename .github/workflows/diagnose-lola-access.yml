name: Diagnose NASA LOLA data access

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_lola_access.py"
      - ".github/workflows/diagnose-lola-access.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analogx-repository-data-refresh-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rasterio
        run: python -m pip install --upgrade rasterio
      - name: Inspect LOLA GeoTIFF metadata and small windows
        run: python scripts/diagnose_lola_access.py
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moon/lola_access_diagnostic.json
          git commit -m "Add LOLA data access diagnostic report"
          git pull --rebase origin main
          git push
